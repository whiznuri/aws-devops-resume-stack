version: '3.8'

services:
  web-resume:
    image: whiznuri363924an/web-resume-app:v1.0
    container_name: web-resume-app
    ports:
      - "8080:80"
    restart: always

  lovelypet:
    image: whiznuri363924an/lovelypet-app:v1.0
    container_name: lovelypet-app
    ports:
      - "80:80"
    depends_on:
      - database
    restart: always

  database:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lovelypet_db
      MYSQL_USER: lovely_user
      MYSQL_PASSWORD: secret123
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-monitor
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    restart: always

  # 🚀 เพิ่ม Grafana ตรงนี้ครับ
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always

volumes:
  mysql_data: