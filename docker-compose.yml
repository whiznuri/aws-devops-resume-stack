version: '3.8'

services:
  web-resume:
    # Next.js (เดิมเป็น PHP) — ใส่ WEB_RESUME_TAG=<commit sha> เพื่อถอยไปเวอร์ชันเก่าได้
    image: whiznuri363924an/web-resume-app:${WEB_RESUME_TAG:-latest}
    container_name: web-resume-app
    ports:
      - "8080:3000"
    mem_limit: 192m
    restart: always

  # ---------- Shopping App (apps/shoppingapp-next) — แทน lovelypet + ministock (ย้ายไป archive/) ----------
  # ค่าลับอ่านจากไฟล์ .env บน EC2 (ไม่อยู่ใน git) · ไม่ตั้ง = compose หยุดพร้อมบอกชื่อตัวแปร (ดีกว่ารันด้วยรหัส default)
  shopping-db:
    image: postgres:17-alpine
    container_name: shopping-db
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${SHOPPING_DB_PASSWORD:?ตั้ง SHOPPING_DB_PASSWORD ใน .env}
      POSTGRES_DB: shop
    volumes:
      - shopping_pg_data:/var/lib/postgresql/data
    # ไม่เปิด port ออกนอกเครื่อง: มีแค่ shopping-api ที่ต้องคุยกับ DB (ผ่าน network ภายใน)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 160m
    restart: always

  shopping-api:
    # FastAPI · ตอนสตาร์ทรัน alembic upgrade head ก่อนเอง · SHOPPING_TAG=<commit sha> เพื่อถอยเวอร์ชัน
    image: whiznuri363924an/shopping-api:${SHOPPING_TAG:-latest}
    container_name: shopping-api
    environment:
      DATABASE_URL: postgresql+psycopg://shop:${SHOPPING_DB_PASSWORD}@shopping-db:5432/shop
      JWT_SECRET: ${SHOPPING_JWT_SECRET:?ตั้ง SHOPPING_JWT_SECRET ใน .env}
      OMISE_SECRET_KEY: ${OMISE_SECRET_KEY:-}
    depends_on:
      shopping-db:
        condition: service_healthy
    mem_limit: 192m
    restart: always

  shopping-web:
    # Next.js standalone · คุยกับ API ผ่าน network ภายใน (BFF) browser ไม่เห็น API ตรง
    image: whiznuri363924an/shopping-web:${SHOPPING_TAG:-latest}
    container_name: shopping-web
    environment:
      API_URL: http://shopping-api:8000
    depends_on:
      - shopping-api
    mem_limit: 192m
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-monitor
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.diffan.dev/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    ports:
      - "3000:3000"
    # ... (ส่วนอื่นของ grafana ปล่อยไว้เหมือนเดิม)

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro #เปลี่ยนจาก - ./certbot/conf:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot #เปลี่ยนจาก - ./certbot/www:/var/www/certbot
    depends_on:
      - web-resume
      - shopping-web
      - grafana

volumes:
  shopping_pg_data:
  # mysql_data (lovelypet/ministock) ถอดออกจาก compose แล้ว — volume เดิมบน EC2 ยังอยู่ ลบเองเมื่อแน่ใจ: docker volume rm <ชื่อ>_mysql_data