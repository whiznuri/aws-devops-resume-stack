apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-resume-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/whiznuri363924an/aws-devops-resume-stack.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true