[project]
name = "shoppingapp-api"
version = "0.1.0"
description = "Shopping app API (FastAPI) — ต่อยอดจาก ministock"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# ให้เทส import `app` ได้ เมื่อรัน `uv run pytest` จากโฟลเดอร์ api
pythonpath = ["."]
testpaths = ["tests"]
