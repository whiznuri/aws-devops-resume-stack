; ตั้งค่า PHP สำหรับขึ้นเซิร์ฟเวอร์จริง
display_errors = Off          ; ไม่โชว์ error (path / SQL) บนหน้าเว็บ
log_errors     = On
error_log      = /dev/stderr  ; error ไปออกที่ docker logs แทน
expose_php     = Off          ; ไม่บอกเวอร์ชัน PHP ใน header
session.cookie_httponly = 1   ; JavaScript อ่าน cookie session ไม่ได้ (ลดผลกระทบ XSS)
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.name = MINISTOCKSESS ; ชื่อ cookie ไม่ชนกับแอป PHP อื่นใน diffan.dev
