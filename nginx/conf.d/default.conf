# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name diffan.dev www.diffan.dev lovelypet.diffan.dev grafana.diffan.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 1. Main Web Resume
server {
    listen 443 ssl;
    server_name diffan.dev www.diffan.dev;

    ssl_certificate /etc/letsencrypt/live/diffan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diffan.dev/privkey.pem;

    # /shop → /shop/ (ให้ลิงก์แบบ relative ในแอปทำงานถูก)
    location = /shop { return 301 /shop/; }

    location /shop/ {
        # resolve ชื่อ container ตอนมี request (ใช้ DNS ภายในของ Docker)
        # ถ้า ministock ล่ม → พังแค่ /shop (502) ไม่ทำให้ nginx ทั้งตัวสตาร์ทไม่ขึ้น
        # และ container ถูกสร้างใหม่ได้ IP ใหม่ก็ไม่ 502 ค้าง (แก้ปัญหาแบบ incident 1 ไปในตัว)
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $shop_upstream http://ministock:80;

        rewrite ^/shop/(.*)$ /$1 break;     # ตัด /shop ออกก่อนส่งให้แอป
        proxy_pass $shop_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web-resume:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

