# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name diffan.dev www.diffan.dev shopping.diffan.dev grafana.diffan.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 1. Main Web Resume
server {
    listen 443 ssl;
    server_name diffan.dev www.diffan.dev;

    ssl_certificate /etc/letsencrypt/live/diffan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diffan.dev/privkey.pem;

    # ministock (/shop) ย้ายไป archive แล้ว → ลิงก์เก่าส่งต่อไปร้านใหม่ ไม่ให้ใครเจอ 404
    location = /shop { return 301 https://shopping.diffan.dev/; }
    location /shop/ { return 301 https://shopping.diffan.dev/; }

    location / {
        proxy_pass http://web-resume:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Shopping App (Next.js → FastAPI ภายใน) — แทน lovelypet.diffan.dev
server {
    listen 443 ssl;
    server_name shopping.diffan.dev;

    ssl_certificate /etc/letsencrypt/live/diffan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diffan.dev/privkey.pem;

    location / {
        # resolve ชื่อ container ตอนมี request (DNS ภายในของ Docker)
        # shopping-web ล่ม → พังแค่ subdomain นี้ (502) nginx ทั้งตัวไม่ล้ม (บทเรียนจาก incident 1)
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $shopping_upstream http://shopping-web:3000;
        proxy_pass $shopping_upstream;

        # Host ต้องตรงกับโดเมนจริง: Next.js เทียบ Origin กับ Host กันฟอร์มปลอมจากเว็บอื่น (Server Actions)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# 3. Grafana Subdomain
server {
    listen 443 ssl;
    server_name grafana.diffan.dev;

    ssl_certificate /etc/letsencrypt/live/diffan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diffan.dev/privkey.pem;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
