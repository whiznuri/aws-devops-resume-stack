# Redirect HTTP (Port 80) -> HTTPS (Port 443)
server {
    listen 80;
    server_name diffan.dev www.diffan.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Configuration
server {
    listen 443 ssl;
    server_name diffan.dev www.diffan.dev;

    ssl_certificate /etc/letsencrypt/live/diffan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diffan.dev/privkey.pem;

    # Web Resume App
    location / {
        proxy_pass http://web-resume:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lovelypet App
    location /lovelypet/ {
        proxy_pass http://lovelypet:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ดักจับ Assets ของ Lovelypet ที่เรียกจาก Root
    location ~* ^/(assets|css|js|images|uploads)/ {
        proxy_pass http://lovelypet:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Grafana Dashboard
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}