server {
    listen 80;
    server_name diffan.dev www.diffan.dev;

    # สำหรับ Certbot ตรวจสอบ Domain (Let's Encrypt Challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Forward หน้าแรกไปยัง Web Resume App
    location / {
        proxy_pass http://web-resume:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward ไปยัง Lovelypet App
    location /lovelypet/ {
        proxy_pass http://lovelypet:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Forward ไปยัง Grafana Dashboard
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}