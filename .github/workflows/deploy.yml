name: Build and Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Login เข้า Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 2: Build และ Push Image web-resume
      - name: Build and Push Web Resume Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-resume
          file: ./apps/web-resume/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/web-resume-app:v1.0
            ${{ secrets.DOCKERHUB_USERNAME }}/web-resume-app:latest

      # Step 3: Build และ Push Image lovelypet ตัวใหม่
      - name: Build and Push LovelyPet Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/lovelypet
          file: ./apps/lovelypet/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lovelypet-app:v1.0
            ${{ secrets.DOCKERHUB_USERNAME }}/lovelypet-app:latest

      # Step 4: SSH เข้า EC2 เพื่อ Pull และ Deploy ทั้ง 2 แอป
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/aws-devops-resume-stack
            git pull origin main
            docker compose pull web-resume lovelypet
            docker compose up -d --force-recreate --remove-orphans web-resume lovelypet
            docker exec nginx-proxy nginx -s reload
            docker image prune -f