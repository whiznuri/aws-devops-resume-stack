name: Build and Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  # =========================================================
  # Quality gate: เทสต้องเขียวก่อน ถึงจะ build / deploy ได้
  # =========================================================
  test-shopping-api:
    runs-on: ubuntu-latest
    services:
      # Postgres จริงสำหรับเทส (มีเทสแย่งชิ้นสุดท้ายพร้อมกัน ต้องใช้ล็อกของ DB จริง ใช้ตัวปลอมไม่ได้)
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/shoppingapp-next/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run pytest (unit + integration)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://shop:shop@localhost:5432/shop_test
        run: uv run pytest -q

  test-shopping-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shoppingapp-next/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/shoppingapp-next/web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx next typegen && npx tsc --noEmit
      - name: Lint
        run: npm run lint

  build-and-deploy:
    needs: [test-shopping-api, test-shopping-web]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Login เข้า Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 2: Build และ Push Image web-resume
      - name: Build and Push Web Resume Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-resume
          file: ./apps/web-resume/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/web-resume-app:v1.0
            ${{ secrets.DOCKERHUB_USERNAME }}/web-resume-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/web-resume-app:latest

      # Step 3: Build และ Push Shopping App (แทน lovelypet + ministock ที่ย้ายไป archive/)
      - name: Build and Push Shopping API Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/shoppingapp-next/api
          file: ./apps/shoppingapp-next/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shopping-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/shopping-api:latest

      - name: Build and Push Shopping Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/shoppingapp-next/web
          file: ./apps/shoppingapp-next/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shopping-web:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/shopping-web:latest

      # =========================================================
      # DevSecOps & Security Compliance: Trivy SBOM Generation
      # =========================================================
      - name: Generate SBOM for Web Resume (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/${{ secrets.DOCKERHUB_USERNAME }}/web-resume-app:latest'
          format: 'cyclonedx'
          output: 'web-resume-sbom.json'

      - name: Generate SBOM for Shopping API (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/${{ secrets.DOCKERHUB_USERNAME }}/shopping-api:latest'
          format: 'cyclonedx'
          output: 'shopping-api-sbom.json'

      - name: Generate SBOM for Shopping Web (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/${{ secrets.DOCKERHUB_USERNAME }}/shopping-web:latest'
          format: 'cyclonedx'
          output: 'shopping-web-sbom.json'

      - name: Upload SBOM Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials
          path: |
            web-resume-sbom.json
            shopping-api-sbom.json
            shopping-web-sbom.json

      # Step 4: SSH เข้า EC2 เพื่อ Pull และ Deploy
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # ค่าลับของ Shopping App เก็บใน GitHub Secrets ที่เดียว แล้วส่งไปเขียนเป็น .env บน EC2 ตอน deploy
          SHOPPING_DB_PASSWORD: ${{ secrets.SHOPPING_DB_PASSWORD }}
          SHOPPING_JWT_SECRET: ${{ secrets.SHOPPING_JWT_SECRET }}
          OMISE_SECRET_KEY: ${{ secrets.OMISE_SECRET_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SHOPPING_DB_PASSWORD,SHOPPING_JWT_SECRET,OMISE_SECRET_KEY
          script: |
            set -e   # คำสั่งไหนพัง หยุดทันที + CI ขึ้นแดง (เดิมพังกลางทางแล้วยังเขียว)
            # เช็คก่อนแตะอะไรบนเครื่อง: ลืมใส่ secret → หยุดตรงนี้ เว็บเดิมรันต่อไม่กระทบ
            [ -n "$SHOPPING_DB_PASSWORD" ] || { echo "ยังไม่ได้ตั้ง GitHub Secret: SHOPPING_DB_PASSWORD"; exit 1; }
            [ -n "$SHOPPING_JWT_SECRET" ] || { echo "ยังไม่ได้ตั้ง GitHub Secret: SHOPPING_JWT_SECRET"; exit 1; }
            cd ~/aws-devops-resume-stack
            git pull origin main
            # เขียน .env ใหม่ทุก deploy (umask 077 = อ่าน/เขียนได้เฉพาะเจ้าของไฟล์) · ไฟล์นี้อยู่ใน .gitignore
            umask 077
            printf 'SHOPPING_DB_PASSWORD=%s\nSHOPPING_JWT_SECRET=%s\nOMISE_SECRET_KEY=%s\n' \
              "$SHOPPING_DB_PASSWORD" "$SHOPPING_JWT_SECRET" "$OMISE_SECRET_KEY" > .env
            docker compose pull web-resume shopping-api shopping-web
            # DB ไม่ force-recreate (ไม่ต้องรีสตาร์ท DB ทุก deploy) · ขึ้นก่อนให้ API มีที่ต่อ
            docker compose up -d shopping-db
            # --remove-orphans: เก็บ container ที่ไม่อยู่ใน compose แล้ว (lovelypet, ministock, mysql-db) · volume ไม่ถูกลบ
            docker compose up -d --force-recreate --remove-orphans web-resume shopping-api shopping-web
            # ทดสอบ config ก่อน reload: ถ้า config ผิด nginx ตัวเดิมยังรันต่อ เว็บไม่ล่ม
            docker exec nginx-proxy nginx -t
            docker exec nginx-proxy nginx -s reload
            docker image prune -f
