name: Build and Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Login เข้า Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 2: Build และ Push Image web-resume
      - name: Build and Push Web Resume Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-resume
          file: ./apps/web-resume/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/web-resume-app:v1.0
            ${{ secrets.DOCKERHUB_USERNAME }}/web-resume-app:latest

      # Step 3: Build และ Push Image lovelypet ตัวใหม่
      - name: Build and Push LovelyPet Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/lovelypet
          file: ./apps/lovelypet/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lovelypet-app:v1.0
            ${{ secrets.DOCKERHUB_USERNAME }}/lovelypet-app:latest

      # Step 3.5: Build และ Push Image ministock (Mini Shopping)
      - name: Build and Push Ministock Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ministock
          file: ./apps/ministock/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ministock-app:v1.0
            ${{ secrets.DOCKERHUB_USERNAME }}/ministock-app:latest

      # =========================================================
      # DevSecOps & Security Compliance: Trivy SBOM Generation
      # =========================================================
      - name: Generate SBOM for Web Resume (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/${{ secrets.DOCKERHUB_USERNAME }}/web-resume-app:latest'
          format: 'cyclonedx'
          output: 'web-resume-sbom.json'

      - name: Generate SBOM for LovelyPet (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lovelypet-app:latest'
          format: 'cyclonedx'
          output: 'lovelypet-sbom.json'

      - name: Generate SBOM for Ministock (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ministock-app:latest'
          format: 'cyclonedx'
          output: 'ministock-sbom.json'

      - name: Upload SBOM Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials
          path: |
            web-resume-sbom.json
            lovelypet-sbom.json
            ministock-sbom.json

      # Step 4: SSH เข้า EC2 เพื่อ Pull และ Deploy ทั้ง 3 แอป
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e   # คำสั่งไหนพัง หยุดทันที + CI ขึ้นแดง (เดิมพังกลางทางแล้วยังเขียว)
            cd ~/aws-devops-resume-stack
            git pull origin main
            docker compose pull web-resume lovelypet ministock
            docker compose up -d --force-recreate --remove-orphans web-resume lovelypet ministock
            # ทดสอบ config ก่อน reload: ถ้า config ผิด nginx ตัวเดิมยังรันต่อ เว็บไม่ล่ม
            docker exec nginx-proxy nginx -t
            docker exec nginx-proxy nginx -s reload
            docker image prune -f